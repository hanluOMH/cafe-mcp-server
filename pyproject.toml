[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cafe-mcp-server"
version = "0.1.0"
description = "A minimal local MCP server that recommends coffee without external APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cafe-mcp-server = "cafe_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
